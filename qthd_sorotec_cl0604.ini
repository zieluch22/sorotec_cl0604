[FILTER]
PROGRAM_EXTENSION = .ngc,.nc,.tap G-Code File (*.ngc,*.nc,*.tap) 
PROGRAM_EXTENSION = .png,.gif,.jpg Greyscale Depth Image
PROGRAM_EXTENSION = .py Python Script
png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode

#py = python
py = python3

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
#PSNG parapeters
RETAIN_G43 = 0
INI_VARS = 1
HAL_PIN_VARS = 1
# macros first (own macros win), then the NGCGUI library and its helper subs
SUBROUTINE_PATH = macros:/home/zieluch/linuxcnc/nc_files/examples/ngcgui_lib:/home/zieluch/linuxcnc/nc_files/examples/ngcgui_lib/utilitysubs
RS274NGC_STARTUP_CODE = G17 G21 G40 G43H0 G54 G64P0.02 G80 G90 G94 G97 M5 M9
PARAMETER_FILE = hallib/linuxcnc.var
FEATURES=30
# interpreter debug log: 0 = off (was 9 = everything). Raise only for debugging.
LOG_LEVEL = 0
#LOG_FILE = /tmp/file-name.log
# runs on every abort (ESC, E-stop, error): drops the automatic drawbar-open request M64 P1
ON_ABORT_COMMAND = O <on_abort> call
# user M-codes M100-M199 (executables), e.g. M190 = VFD Modbus reconnect
USER_M_PATH = mcodes


# This is the M6 REMAP for rack change
# old version here tool offset dissapears 
REMAP=M6   modalgroup=6  prolog=change_prolog   ngc=rack_change  epilog=change_epilog


[PYTHON]
PATH_PREPEND = ./python
TOPLEVEL = python/toplevel.py
PATH_APPEND = ~/linuxcnc/nc_files/remap_lib/python-stdglue/python
LOG_LEVEL = 0

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
