#********************
# VFD Simphoenix E500 over Modbus RTU (used by hallib/spindle_setup.hal)
# Spindle 30000 rpm @ 500 Hz, 2.2 kW (60 rpm/Hz)
#   CMD_GAIN    = MAX_HZ*10 / MAX_RPM          rpm    -> 0.1 Hz register
#   FB_RPS_GAIN = MAX_RPM / (MAX_HZ*10*60)     0.1 Hz -> rev/s
#   FB_RPM_GAIN = MAX_RPM / (MAX_HZ*10)        0.1 Hz -> rpm
#   MAX_FREQ    = MAX_HZ*10 = 5000  (keep equal to VFD F0.04 = 500.0)
#********************
[VFD]
CMD_GAIN = 0.166667
FB_RPS_GAIN = 0.1
FB_RPM_GAIN = 6.0
MAX_FREQ = 5000
# --- Spindle speed thresholds ---
# START: motion continues when spindle reaches this share of the target speed.
#   AT_SPEED_SCALE = 1 / fraction:  95 % = 1.052632   90 % = 1.111111   98 % = 1.020408
AT_SPEED_SCALE = 1.052632
# STOP: after M5 motion continues when spindle is below this share of its last speed (0.20 = 20 %)
STOP_SPEED_RATIO = 0.20
# Real standstill for drawbar / seal air / M6, in 0.1 Hz units (5 = 0.5 Hz)
STANDSTILL_FREQ = 5
# --- Spindle overload -> feed hold (spindle keeps turning) ---
# Set OVERLOAD_AMPS to the spindle's RATED current from the motor nameplate.
OVERLOAD_AMPS = 9.0
# hysteresis [A]: hold releases below OVERLOAD_AMPS - HYST/2
OVERLOAD_HYST = 1.0
# current must stay above the limit this long [s] before feed is held
OVERLOAD_DELAY = 0.5

[PROBE_SCREEN]
# Offset from [AXIS_Z]MAX_LIMIT for performing moves during various probe
# screen movements. This must be a negative number.
Z_SAFE_TRAVEL_OFFSET = -0.5

[TOOLSENSOR]
# Absolute coordinates of the toolsetter pad
X = 33
Y = 356.3
# Absolute Z start search coordinates
Z = -55
# Maximum search distance and direction (sign)
MAXPROBE = -90
# Speed of movements during working in Probe Screen
RAPID_SPEED = 3000
# Diameter of toolsetter pad
TS_DIAMETER = 10
# Fast approach for rack tools [mm]: G0 to this distance above the tool's last
# touch (tool_touch.log, machine Z), then search 2x this distance. 0 = always slow from Z.
FAST_APPROACH = 10
# The speed of the reverse rotation of the spindle when measuring the tool diameter
REV_ROTATION_SPEED = 300

# ATC specific parameters for a rack style tool changer
[ATC]
#******************************************
# Abs coordinates tool change point for manual operation of tools (manual hand over)
# for this machine this is directly above the tool length sensor to save time
CHANGEX = 150
CHANGEY = 300
CHANGEZ = -10
# Number of pockets that are available in the rack
NUMPOCKETS = 5
# Speed at which the machine drops of the tool for safe distance move for XY and Z
DROPSPEEDRAPID = 2000
DROPSPEEDXY = 3000
#Speed at which the tool is putinto/ removed from craddle
DROPSPEEDZ = 500
#[ATC_FIRST_POCKET]
# Is the G53 coord TCP position of the first pocket when getting or putting a tool; i.e. the position 
FIRSTPOCKET_X = 9.0
FIRSTPOCKET_Y = 4.6
FIRSTPOCKET_Z = -115.9

#[ATC_TOOL_SAFE_DISTANCE]
# the distance in X, Y that is required to ensure safe g0 movements 
# Movement is done X,Y,Z - be VERY carfeful in choosing these values EXTREME DANGER
# these are relative moves - observe signed direction
# consider the movement from the safe position to the pocket (e.g. safe position is at a smaller Y value; y needs to be positive)
# Note: Moves happen first X then Y
SAFE_X = -40
SAFE_Y = 0
# Z is given in absolute coordinates and should be the height, where the spindle nose clears the tool holder 
SAFE_Z = -10
#Height at which flush is triggered
OFF_HEIGHT_Z = -108
#[ATC_TOOL_SLOT_DELTA]
# Is the distance between two pockets - it is recommended to place the rack along one axis; does not consider Z
DELTA_X = 0
DELTA_Y = 65
# Time to wait before drop off to ensure that the spindle is stopped in [s]
WAITSPINDLE = 0.4
# Max time [s] to wait for the spindle to stop at M6 (VFD decel F0.06 + margin)
SPINDLE_STOP_TIMEOUT = 20
# Max time [s] to wait for drawbar open/closed and tool clamped sensors
DRAWBAR_TIMEOUT = 2
# [s] tool clamped + drawbar closed must be stable this long before the VFD may run (spindle_setup.hal)
DRAWBAR_SETTLE = 0.5
# [s] spindle must be at standstill this long before the drawbar may open (atc.hal)
SPINDLE_STOP_HOLD = 0.5

[ATC_PINS]
# motion.digital-out-NN pins
# Pin to trigger air blast at TS
