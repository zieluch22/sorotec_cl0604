# mb2hal configuration - ColdEnd mist controller (Arduino Nano, USB, firmware coldend/firmware)
# Used by hallib/coldend.hal. Register map: see the header of the .ino file.
#
# A SEPARATE mb2hal instance (HAL_MODULE_NAME=coldend-mb) from the VFD one (mb2hal):
# the VFD reconnect (M190 / vfd_reconnect.sh) only unloads "mb2hal" and never touches this one.
# Different serial settings than the VFD: 9600 8N1 (VFD: 8E1), slave 6, own USB port /dev/coldend.
#
# Pins (LinuxCNC 2.9 names):
#   coldend-mb.cmd.00..06.bit        bits written: active, LED, coolant, fast, spit, air, direction
#   coldend-mb.rates.00..04.float    written: mist/fast/spit rate (0.1 ml/h), spit time (ms), reserved
#   coldend-mb.inputs.00..03.bit     bits read: fw-active, mist switch, fast switch, air switch
#   coldend-mb.status.00..08.float   read: mist knob, spit knob, spit time left,
#                                          echo of the 5 written values, firmware version

[MB2HAL_INIT]
INIT_DEBUG=1
VERSION=1.1
HAL_MODULE_NAME=coldend-mb
SLOWDOWN=0.0
TOTAL_TRANSACTIONS=4

# ---------------------------------------------------------------------
# 0: command bits 8192..8198 - every cycle (this is also the heartbeat)
# ---------------------------------------------------------------------
[TRANSACTION_00]
LINK_TYPE=serial
SERIAL_PORT=/dev/coldend
SERIAL_BAUD=9600
SERIAL_BITS=8
SERIAL_PARITY=none
SERIAL_STOP=1
SERIAL_DELAY_MS=0
MB_SLAVE_ID=6
FIRST_ELEMENT=8192
NELEMENTS=7
MB_TX_CODE=fnct_15_write_multiple_coils
MB_RESPONSE_TIMEOUT_MS=200
MB_BYTE_TIMEOUT_MS=50
HAL_TX_NAME=cmd
MAX_UPDATE_RATE=0.0
DEBUG=1

# ---------------------------------------------------------------------
# 1: rates, spit time, microstep 8451..8455
# ---------------------------------------------------------------------
[TRANSACTION_01]
LINK_TYPE=serial
SERIAL_PORT=/dev/coldend
SERIAL_BAUD=9600
SERIAL_BITS=8
SERIAL_PARITY=none
SERIAL_STOP=1
SERIAL_DELAY_MS=0
MB_SLAVE_ID=6
FIRST_ELEMENT=8451
NELEMENTS=5
MB_TX_CODE=fnct_16_write_multiple_registers
MB_RESPONSE_TIMEOUT_MS=200
MB_BYTE_TIMEOUT_MS=50
HAL_TX_NAME=rates
MAX_UPDATE_RATE=5.0
DEBUG=1

# ---------------------------------------------------------------------
# 2: discrete inputs 8199..8202 - fw active + the 3 board switches
# ---------------------------------------------------------------------
[TRANSACTION_02]
LINK_TYPE=serial
SERIAL_PORT=/dev/coldend
SERIAL_BAUD=9600
SERIAL_BITS=8
SERIAL_PARITY=none
SERIAL_STOP=1
SERIAL_DELAY_MS=0
MB_SLAVE_ID=6
FIRST_ELEMENT=8199
NELEMENTS=4
MB_TX_CODE=fnct_02_read_discrete_inputs
MB_RESPONSE_TIMEOUT_MS=200
MB_BYTE_TIMEOUT_MS=50
HAL_TX_NAME=inputs
MAX_UPDATE_RATE=0.0
DEBUG=1

# ---------------------------------------------------------------------
# 3: knobs, spit time left, echo of written values, firmware version 8448..8456
# ---------------------------------------------------------------------
[TRANSACTION_03]
LINK_TYPE=serial
SERIAL_PORT=/dev/coldend
SERIAL_BAUD=9600
SERIAL_BITS=8
SERIAL_PARITY=none
SERIAL_STOP=1
SERIAL_DELAY_MS=0
MB_SLAVE_ID=6
FIRST_ELEMENT=8448
NELEMENTS=9
MB_TX_CODE=fnct_03_read_holding_registers
MB_RESPONSE_TIMEOUT_MS=200
MB_BYTE_TIMEOUT_MS=50
HAL_TX_NAME=status
MAX_UPDATE_RATE=10.0
DEBUG=1
