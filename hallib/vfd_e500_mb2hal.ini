# Used by hallib/spindle_setup.hal (loadusr mb2hal). Machine: Sorotec CL0604, VFD: Simphoenix E500
# NOTE: mb2hal truncates SERIAL_PORT to 31 chars - use /dev/ttyUSB0 or a short udev symlink like /dev/vfd485

# =====================================================================
#  mb2hal configuration - Simphoenix E500 VFD over Modbus RTU (RS485)
#  Register map taken from E500 manual, Appendix II (p.98-99):
#    0x1001 (4097)  Operation command  1=FWD run, 2=REV run, 3=Stop,
#                                      0x20=fault reset
#    0x1002 (4098)  Frequency setting  in 0.1 Hz  (500 = 50.0 Hz)
#    0x2000 (8192)  Inverter status    (3=stopped, 1=FWD, 2=REV, 0x20=fault...)
#    0x2001 (8193)  Fault code         (0x000C = Fu.12)
#    0xD000 (53248) d-00 output frequency (0.1 Hz)
#    0xD001 (53249) d-01 output current   (0.1 A)
#    0xD002 (53250) d-02 output voltage   (V)
#    0xD003 (53251) d-03 motor speed      (rpm)
#    0xD004 (53252) d-04 DC bus voltage, 0xD005 (53253) d-05 input AC voltage
#    0xD00B (53259) d-11 module temperature
#    0xD017-0xD01A (53271-53274) d-23..d-26 last 4 fault records
#    0xD01B-0xD01F (53275-53279) d-27..d-31 freq, current, volts, DC, temp at the last fault
#  Max. 6 registers per read (manual p.95).
#
#  Serial settings below must match VFD parameter F4.00
#    F4.00 = 0114 -> Modbus, even parity, 9600  (factory default)
#    F4.00 = 0115 -> Modbus, even parity, 19200 (then set SERIAL_BAUD=19200)
#  Slave ID must match F4.01 (default 1).
# =====================================================================

[MB2HAL_INIT]
INIT_DEBUG=1
VERSION=1.1
HAL_MODULE_NAME=mb2hal
SLOWDOWN=0.0
TOTAL_TRANSACTIONS=8

# ---------------------------------------------------------------------
# 0: write run command (FWD / REV / STOP) -> 0x1001
#    Written every cycle, which also keeps the VFD comm watchdog (F4.04) happy
# ---------------------------------------------------------------------
[TRANSACTION_00]
LINK_TYPE=serial
SERIAL_PORT=/dev/vfd485
SERIAL_BAUD=9600
SERIAL_BITS=8
SERIAL_PARITY=even
SERIAL_STOP=1
SERIAL_DELAY_MS=10
MB_SLAVE_ID=1
FIRST_ELEMENT=4097
NELEMENTS=1
MB_TX_CODE=fnct_06_write_single_register
MB_RESPONSE_TIMEOUT_MS=500
MB_BYTE_TIMEOUT_MS=500
HAL_TX_NAME=vfd-cmd
MAX_UPDATE_RATE=0.0
DEBUG=1

# ---------------------------------------------------------------------
# 1: write frequency setpoint (0.1 Hz units) -> 0x1002
# ---------------------------------------------------------------------
[TRANSACTION_01]
LINK_TYPE=serial
SERIAL_PORT=/dev/vfd485
SERIAL_BAUD=9600
SERIAL_BITS=8
SERIAL_PARITY=even
SERIAL_STOP=1
SERIAL_DELAY_MS=10
MB_SLAVE_ID=1
FIRST_ELEMENT=4098
NELEMENTS=1
MB_TX_CODE=fnct_06_write_single_register
MB_RESPONSE_TIMEOUT_MS=500
MB_BYTE_TIMEOUT_MS=500
HAL_TX_NAME=vfd-freq
MAX_UPDATE_RATE=0.0
DEBUG=1

# ---------------------------------------------------------------------
# 2: read monitoring values d-00..d-03 (0xD000..0xD003)
#    pins: mb2hal.vfd-mon.00 = out freq (0.1Hz), .01 = current (0.1A),
#          .02 = voltage (V), .03 = motor rpm
# ---------------------------------------------------------------------
[TRANSACTION_02]
LINK_TYPE=serial
SERIAL_PORT=/dev/vfd485
SERIAL_BAUD=9600
SERIAL_BITS=8
SERIAL_PARITY=even
SERIAL_STOP=1
SERIAL_DELAY_MS=10
MB_SLAVE_ID=1
FIRST_ELEMENT=53248
NELEMENTS=4
MB_TX_CODE=fnct_03_read_holding_registers
MB_RESPONSE_TIMEOUT_MS=500
MB_BYTE_TIMEOUT_MS=500
HAL_TX_NAME=vfd-mon
MAX_UPDATE_RATE=0.0
DEBUG=1

# ---------------------------------------------------------------------
# 3: read inverter status + fault code (0x2000, 0x2001)
#    pins: mb2hal.vfd-stat.00 = status, .01 = fault code (Fu.xx)
# ---------------------------------------------------------------------
[TRANSACTION_03]
LINK_TYPE=serial
SERIAL_PORT=/dev/vfd485
SERIAL_BAUD=9600
SERIAL_BITS=8
SERIAL_PARITY=even
SERIAL_STOP=1
SERIAL_DELAY_MS=10
MB_SLAVE_ID=1
FIRST_ELEMENT=8192
NELEMENTS=2
MB_TX_CODE=fnct_03_read_holding_registers
MB_RESPONSE_TIMEOUT_MS=500
MB_BYTE_TIMEOUT_MS=500
HAL_TX_NAME=vfd-stat
MAX_UPDATE_RATE=0.0
DEBUG=1

# ---------------------------------------------------------------------
# 4: read d-04 DC bus voltage, d-05 input AC voltage, 1 Hz
#    display only: not used by the spindle safety logic
# ---------------------------------------------------------------------
[TRANSACTION_04]
LINK_TYPE=serial
SERIAL_PORT=/dev/vfd485
SERIAL_BAUD=9600
SERIAL_BITS=8
SERIAL_PARITY=even
SERIAL_STOP=1
SERIAL_DELAY_MS=10
MB_SLAVE_ID=1
FIRST_ELEMENT=53252
NELEMENTS=2
MB_TX_CODE=fnct_03_read_holding_registers
MB_RESPONSE_TIMEOUT_MS=150
MB_BYTE_TIMEOUT_MS=150
HAL_TX_NAME=vfd-mon2
MAX_UPDATE_RATE=1.0
DEBUG=1

# ---------------------------------------------------------------------
# 5: read d-11 module temperature, 1 Hz
#    display only: not used by the spindle safety logic
# ---------------------------------------------------------------------
[TRANSACTION_05]
LINK_TYPE=serial
SERIAL_PORT=/dev/vfd485
SERIAL_BAUD=9600
SERIAL_BITS=8
SERIAL_PARITY=even
SERIAL_STOP=1
SERIAL_DELAY_MS=10
MB_SLAVE_ID=1
FIRST_ELEMENT=53259
NELEMENTS=1
MB_TX_CODE=fnct_03_read_holding_registers
MB_RESPONSE_TIMEOUT_MS=150
MB_BYTE_TIMEOUT_MS=150
HAL_TX_NAME=vfd-temp
MAX_UPDATE_RATE=1.0
DEBUG=1

# ---------------------------------------------------------------------
# 6: read d-23..d-28 fault records + freq, current at the last fault, every 5 s
#    display only: not used by the spindle safety logic
# ---------------------------------------------------------------------
[TRANSACTION_06]
LINK_TYPE=serial
SERIAL_PORT=/dev/vfd485
SERIAL_BAUD=9600
SERIAL_BITS=8
SERIAL_PARITY=even
SERIAL_STOP=1
SERIAL_DELAY_MS=10
MB_SLAVE_ID=1
FIRST_ELEMENT=53271
NELEMENTS=6
MB_TX_CODE=fnct_03_read_holding_registers
MB_RESPONSE_TIMEOUT_MS=150
MB_BYTE_TIMEOUT_MS=150
HAL_TX_NAME=vfd-flt1
MAX_UPDATE_RATE=0.2
DEBUG=1

# ---------------------------------------------------------------------
# 7: read d-29..d-31 volts, DC, temp at the last fault, every 5 s
#    display only: not used by the spindle safety logic
# ---------------------------------------------------------------------
[TRANSACTION_07]
LINK_TYPE=serial
SERIAL_PORT=/dev/vfd485
SERIAL_BAUD=9600
SERIAL_BITS=8
SERIAL_PARITY=even
SERIAL_STOP=1
SERIAL_DELAY_MS=10
MB_SLAVE_ID=1
FIRST_ELEMENT=53277
NELEMENTS=3
MB_TX_CODE=fnct_03_read_holding_registers
MB_RESPONSE_TIMEOUT_MS=150
MB_BYTE_TIMEOUT_MS=150
HAL_TX_NAME=vfd-flt2
MAX_UPDATE_RATE=0.2
DEBUG=1
